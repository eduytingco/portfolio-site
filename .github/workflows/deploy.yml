name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: (Optional) Build site
        run: |
          if [ -f package.json ]; then
            npm ci
            if npm run | grep -q "build"; then
              npm run build
            fi
          fi

      - name: Show workspace for debug
        run: |
          echo "Repo root:"
          ls -la
          echo "Contents of repo root (first 200 entries):"
          ls -la | sed -n '1,200p'

      - name: Upload via lftp (FTPS, insecure TLS - hostname mismatch tolerated)
        env:
          HOST: ${{ secrets.HOSTINGER_HOST }}
          USER: ${{ secrets.HOSTINGER_USER }}
          PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
          REMOTE_DIR: /public_html/ed/
          LOCAL_DIR: ./
        run: |
          set -euo pipefail
          echo "Installing lftp..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq lftp
          echo "Uploading $LOCAL_DIR -> ftps://$HOST:$21$REMOTE_DIR (FTPS, certificate verification disabled)"
          # NOTE: set ssl:verify-certificate no disables TLS hostname/cert verification.
          # Prefer to fix HOST to use the hostname matching the certificate and remove that setting.
          lftp -u "$USER","$PASS" -p 21 ftps://"$HOST" -e "set ssl:verify-certificate no; set net:timeout 60; mirror -R --verbose --delete --only-newer \"$LOCAL_DIR\" \"$REMOTE_DIR\"; bye"