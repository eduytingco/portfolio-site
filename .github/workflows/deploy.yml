  name: Deploy

  on:
    push:
      branches: [ main ]
    workflow_dispatch:

  jobs:
    deploy:
      runs-on: self-hosted
      timeout-minutes: 60
      steps:
        - name: FTPS verbose debug (passive/active + curl)
          env:
            HOST: ${{ secrets.HOSTINGER_HOST }}
            USER: ${{ secrets.HOSTINGER_USER }}
            PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
            PORT: 21
            REMOTE_DIR: /public_html/ed/
          run: |
            set -euo pipefail
            set -x

            sudo apt-get update -qq
            sudo apt-get install -y -qq lftp curl netcat-openbsd

            echo "=== TCP connect (sanity) ==="
            nc -vz -w 5 "$HOST" "$PORT" || echo "port $PORT connect failed"

            echo
            echo "=== lftp verbose: passive mode (ls) ==="
            timeout 20 lftp -d -u "$USER","$PASS" -p "$PORT" ftps://"$HOST" -e "set ssl:verify-certificate no; set net:timeout 10; set net:max-retries 1; set ftp:passive-mode yes; set ftp:prefer-epsv yes; ls -la $REMOTE_DIR; bye" || true

            echo
            echo "=== lftp verbose: active mode (ls) ==="
            timeout 20 lftp -d -u "$USER","$PASS" -p "$PORT" ftps://"$HOST" -e "set ssl:verify-certificate no; set net:timeout 10; set net:max-retries 1; set ftp:passive-mode no; set ftp:prefer-epsv no; ls -la $REMOTE_DIR; bye" || true

            echo
            echo "=== curl FTPS list (verbose) ==="
            timeout 20 curl -v --ftp-ssl -k "ftp://$USER:$PASS@$HOST:$PORT$REMOTE_DIR" || true
        - name: Checkout
          uses: actions/checkout@v4

        - name: (Optional) Build site
          run: |
            if [ -f package.json ]; then
              npm ci
              if npm run | grep -q "build"; then
                npm run build
              fi
            fi

        - name: Show workspace for debug
          run: |
            echo "Repo root:"
            ls -la
            echo "Contents of repo root (first 200 entries):"
            ls -la | sed -n '1,200p'

        - name: Upload via lftp (FTPS — parallel)
          env:
            HOST: ${{ secrets.HOSTINGER_HOST }}
            USER: ${{ secrets.HOSTINGER_USER }}
            PASS: ${{ secrets.HOSTINGER_FTP_PASSWORD }}
            REMOTE_DIR: /public_html/ed/
            LOCAL_DIR: ./
            PORT: 21
          run: |
            set -euo pipefail
            echo "Installing lftp..."
            sudo apt-get update -qq
            sudo apt-get install -y -qq lftp

            # NOTE: ssl:verify-certificate is disabled here because the server's TLS cert CN previously didn't match the host/IP used.
            # After you update HOSTINGER_HOST to the Hostinger-provided hostname (e.g., ftpXXX.hstgr.io), remove the 'set ssl:verify-certificate no' setting.
            LFTP_OPTS='set ssl:verify-certificate no; set net:timeout 60; set net:max-retries 1; set net:reconnect-interval-base 1'

            echo "Uploading $LOCAL_DIR -> ftps://$HOST:$PORT$REMOTE_DIR using parallel transfers"
            lftp -u "$USER","$PASS" -p "$PORT" ftps://"$HOST" -e \
              "$LFTP_OPTS; mirror -R --verbose --parallel=5 --delete --only-newer \
              --exclude-glob .git --exclude-glob node_modules --exclude-glob '*.map' \
              \"$LOCAL_DIR\" \"$REMOTE_DIR\"; bye"