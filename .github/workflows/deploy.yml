name: Deploy to Hostinger

on:
  push:
    branches: [ main ]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: (Optional) Build site
        run: |
          if [ -f package.json ]; then
            npm ci
            if npm run | grep -q "build"; then
              npm run build
            fi
          fi

      - name: Show workspace for debug
        run: |
          echo "Repo root:"
          ls -la
          echo "Contents of repo root (first 200 entries):"
          ls -la | sed -n '1,200p'

      - name: Deploy to Hostinger via FTP (dry run)
        uses: SamKirkland/FTP-Deploy-Action@v4.3.5
        with:
          server: ${{ secrets.HOSTINGER_HOST }}        # or secrets.FTP_SERVER if you prefer
          username: ${{ secrets.HOSTINGER_USER }}      # or secrets.FTP_USERNAME
          password: ${{ secrets.HOSTINGER_FTP_PASSWORD }} # or secrets.FTP_PASSWORD
          protocol: FTPS
          port: 21
          local-dir: ./                                # matches your working main.yml
          server-dir: /public_html/ed/
          dry-run: true
          log-level: verbose
