name: Deploy GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
        with:
          enablement: true

      - name: Remove dev dependencies from publish folder
        run: rm -rf node_modules

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: .

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}

    steps:
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4

  deploy-ftp:
    needs: build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      - name: Install dependencies
        run: npm install

      - name: Build TypeScript
        run: npm run build

      - name: Remove dev dependencies from publish folder
        run: rm -rf node_modules

      - name: Deploy to uytingco.com via SFTP
        timeout-minutes: 10
        env:
          SFTP_SERVER: ${{ secrets.SFTP_SERVER }}
          SFTP_PORT: ${{ secrets.SFTP_PORT }}
          SFTP_USERNAME: ${{ secrets.SFTP_USERNAME }}
          SSH_PRIVATE_KEY: ${{ secrets.SSH_PRIVATE_KEY }}
        run: |
          sudo apt-get update && sudo apt-get install -y lftp
          key_file="$RUNNER_TEMP/deploy_key"
          printf '%s\n' "$SSH_PRIVATE_KEY" > "$key_file"
          chmod 600 "$key_file"
          port="${SFTP_PORT:-22}"
          lftp -d -c "
            set net:timeout 30;
            set net:max-retries 5;
            set net:reconnect-interval-base 5;
            set sftp:connect-program \"ssh -a -x -i $key_file -o StrictHostKeyChecking=accept-new\";
            set xfer:log true;
            open -u \"$SFTP_USERNAME\", -p $port sftp://$SFTP_SERVER;
            mirror --reverse --delete --verbose \
              --exclude-glob .git* \
              --exclude actions-runner/ \
              . /home/u585272320/domains/uytingco.com/public_html/ed/
          "
          rm -f "$key_file"
