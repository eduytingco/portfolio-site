<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>Ed Uytingco Online Portfolio</title>

    <link rel="stylesheet" href="src/static/css/edsite-styles.css" />
    <script src="dist/static/js/edsite-scripts.js" type="module"></script>
</head>

<body>
    <main>
        <section id="hero" aria-labelledby="hero-title">
            <img
                src="src/static/images/Ed-hero-cover.JPEG"
                class="hero-image"
                alt="Ed Uytingco standing in a field at sunset"
            />

            <div class="hero-gradient" aria-hidden="true"></div>

            <div class="hero-content">
                <p class="hero-tagline"></p>

                <h1 id="hero-title"></h1>

                <p class="hero-description"></p>

                <a
                    href="#projects"
                    class="hero-button"
                ></a>
            </div>

            <a
                href="#about"
                class="scroll-indicator"
                aria-label="Scroll to the About section"
            >
                <svg
                    width="28"
                    height="28"
                    viewBox="0 0 24 24"
                    aria-hidden="true"
                    focusable="false"
                >
                    <path
                        d="M6 9l6 6 6-6"
                        fill="none"
                        stroke="currentColor"
                        stroke-width="2"
                        stroke-linecap="round"
                        stroke-linejoin="round"
                    />
                </svg>
            </a>
        </section>

        <section id="about" aria-labelledby="about-title">
            <div id="about-content" class="container">
                <h2 id="about-title"></h2>

                <p id="about-description"></p>

                <a
                    id="about-button"
                    class="section-button"
                    href="pages.html?page=about"
                ></a>
            </div>
        </section>

        <section id="projects" aria-labelledby="projects-title">
            <div id="projects-content" class="container">
                <h2 id="projects-title"></h2>

                <p id="projects-description"></p>

                <a
                    id="projects-button"
                    class="section-button"
                    href="pages.html?page=projects"
                ></a>
            </div>
        </section>

        <section id="contact" aria-labelledby="contact-title">
            <div id="contact-content" class="container">
                <h2 id="contact-title"></h2>

                <p id="contact-description"></p>

                <a
                    id="contact-button"
                    class="section-button"
                    href="pages.html?page=contact"
                ></a>
            </div>
        </section>
    </main>

    <footer id="footer">
        <div class="container">
            <span id="footer-content"></span>
        </div>
    </footer>
</body>

</html>
