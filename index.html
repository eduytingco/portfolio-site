<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <link rel="icon" type="image/svg+xml" href="ed-favicon-brand.svg">
    <title>Ed Uytingco Online Portfolio</title>
    <link rel="stylesheet" href="src/static/css/edsite-styles.css" />
</head>

<body>
    <header class="site-header">
        <nav id="subpage-nav" class="site-nav" aria-label="Primary navigation">
            <a class="brand" href="index.html" aria-label="Ed Uytingco home">
                <span class="brand-mark" aria-hidden="true">E</span>
                <span class="brand-name" id="brand-name">{brand.name}</span>
            </a>
            <button id="nav-menu-toggle" class="nav-menu-toggle" type="button" aria-expanded="false"
                aria-controls="nav-menu" aria-label="Open navigation menu">
                <span></span><span></span><span></span>
            </button>
            <ul id="nav-menu" class="nav-menu">
                <li><a href="pages.html?page=about" nav-link-id="about">{nav.about}</a></li>
                <li><a href="pages.html?page=projects" nav-link-id="projects">{nav.projects}</a></li>
                <li><a href="pages.html?page=experience" nav-link-id="experience">{nav.experience}</a></li>
                <li><a href="pages.html?page=contact" nav-link-id="contact">{nav.contact}</a></li>
            </ul>
        </nav>
    </header>

    <main>
        <section id="hero" class="hero" aria-labelledby="hero-title">
            <img class="hero-image" src="src/static/images/edsite-portrait-hero.PNG"
                alt="Ed Uytingco standing outdoors with a hillside neighborhood in the background" />
            <div class="hero-gradient" aria-hidden="true"></div>

            <div class="hero-inner">
                <div class="hero-content">
                    <p id="hero-tagline" class="hero-tagline"></p>
                    <h1 id="hero-title"></h1>
                    <p id="hero-description" class="hero-description"></p>
                    <a id="hero-button" class="hero-button" href="pages.html?page=projects"
                        aria-label="View my portfolio">
                        <span></span><span aria-hidden="true">→</span>
                    </a>
                </div>
            </div>

            <a class="scroll-indicator" href="#quick-links" aria-label="Scroll to the portfolio sections">
                <svg width="34" height="34" viewBox="0 0 24 24" aria-hidden="true" focusable="false">
                    <path d="M6 9l6 6 6-6" fill="none" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"
                        stroke-linejoin="round" />
                </svg>
            </a>
        </section>

        <section id="quick-links" class="quick-links" aria-label="Portfolio sections">
            <div class="quick-links-grid">
                <article id="about" class="quick-card">
                    <div class="quick-card-container">
                        <div class="quick-card-icon" aria-hidden="true">◎</div>
                        <h2 id="about-title"></h2>
                    </div>
                    <p id="about-description"></p>
                    <a id="about-button" href="pages.html?page=about"></a>
                </article>
                <article id="projects" class="quick-card">
                    <div class="quick-card-container">
                        <div class="quick-card-icon" aria-hidden="true">⊞</div>
                        <h2 id="projects-title"></h2>
                    </div>
                    <p id="projects-description"></p>
                    <a id="projects-button" href="pages.html?page=projects"></a>
                </article>
                <article id="experience" class="quick-card">
                    <div class="quick-card-container">
                        <div class="quick-card-icon quick-card-icon-code" aria-hidden="true">&lt;/&gt;</div>
                        <h2 id="experience-title"></h2>
                    </div>
                    <p id="experience-description"></p>
                    <a id="experience-button" href="pages.html?page=experience"></a>
                </article>
                <article id="contact" class="quick-card">
                    <div class="quick-card-container">
                        <div class="quick-card-icon" aria-hidden="true">&#x2709;</div>
                        <h2 id="contact-title"></h2>
                    </div>
                    <p id="contact-description"></p>
                    <a id="contact-button" href="pages.html?page=contact"></a>
                </article>
            </div>
        </section>
    </main>

    <footer id="footer"><span role="footer-content"></span></footer>
    <script src="dist/static/js/edsite-scripts.js" type="module"></script>
</body>

</html>
