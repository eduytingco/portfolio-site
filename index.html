<body>

        <section id="hero">
            <div class="container">
                <svg xmlns="http://www.w3.org/2000/svg" xmlns:xlink="http://www.w3.org/1999/xlink" role="img"
                    aria-labelledby="heroLogoTitle heroLogoDesc" width="100" zoomAndPan="magnify"
                    viewBox="0 0 75 74.999997" height="100" preserveAspectRatio="xMidYMid meet" version="1.0">
                    <title id="heroLogoTitle">Animated EU hero logo</title>
                    <desc id="heroLogoDesc">A circular EU monogram draws and reveals once.</desc>
                    <defs>
                        <style>
                            .hero-bg {
                                opacity: 0;
                                transform-box: fill-box;
                                transform-origin: center;
                                animation: heroBgIn 0.55s ease-out 0.05s forwards;
                            }

                            .hero-ring {
                                stroke-dasharray: 1600;
                                stroke-dashoffset: 1600;
                                animation: heroRingDraw 1.4s cubic-bezier(.65, 0, .25, 1) 0.15s forwards;
                            }

                            .hero-letter {
                                opacity: 0;
                                transform-box: fill-box;
                                transform-origin: center;
                            }

                            .hero-letter-e {
                                animation: heroLetterIn 0.65s cubic-bezier(.2, .85, .25, 1.15) 0.72s forwards;
                            }

                            .hero-letter-u {
                                animation: heroLetterIn 0.65s cubic-bezier(.2, .85, .25, 1.15) 0.9s forwards;
                            }

                            @keyframes heroBgIn {
                                from {
                                    opacity: 0;
                                    transform: scale(.82);
                                }

                                to {
                                    opacity: 1;
                                    transform: scale(1);
                                }
                            }

                            @keyframes heroRingDraw {
                                to {
                                    stroke-dashoffset: 0;
                                }
                            }

                            @keyframes heroLetterIn {
                                from {
                                    opacity: 0;
                                    transform: translateY(8px) scale(.86) rotate(-4deg);
                                }

                                to {
                                    opacity: 1;
                                    transform: translateY(0) scale(1) rotate(0);
                                }
                            }

                            @media (prefers-reduced-motion: reduce) {

                                .hero-bg,
                                .hero-ring,
                                .hero-letter {
                                    animation: none;
                                    opacity: 1;
                                    transform: none;
                                    stroke-dashoffset: 0;
                                }
                            }
                        </style>
                        <g />

                                            </g>

                <div id="hero-content">
