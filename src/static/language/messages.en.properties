page.about.title=Who I Am
page.about.description=I’m a Design Engineer who enjoys bringing together design, technology, and problem-solving to create digital experiences that are intuitive, accessible, and meaningful. My work combines UX design with front-end engineering, allowing me to bridge the gap between concept and implementation while delivering solutions that meet both user needs and business goals.\n\n Since 2016, I’ve been helping build enterprise web experiences at Texas Instruments, contributing to UX design, design systems, front-end development, personalization, usability research, and accessibility initiatives. I enjoy collaborating with cross-functional teams to transform complex challenges into simple, scalable, and user-centered solutions.\n\n With a background in Fine Arts from San Jose State University, I approach every project with both creativity and technical precision. I work with modern web technologies, including TypeScript, JavaScript, HTML, CSS, Sass, React, and component-based design systems, to create experiences that are both visually engaging and technically robust.\n\n I’m passionate about continuous learning and always looking for opportunities to improve my craft. Whether I’m designing a new interface, refining a user journey, or developing reusable front-end components, my goal is to build products that make technology easier to use and create lasting value for users.
page.projects.title=My Projects
page.projects.description=Every project represents an opportunity to solve real-world challenges through thoughtful design, strategic thinking, and modern technology. My work spans user experience design, front-end development, design systems, accessibility, personalization, and digital product innovation, with a focus on creating solutions that are both intuitive and impactful.\n\n From concept to implementation, I collaborate with cross-functional teams to transform ideas into scalable, user-centered experiences that balance business objectives with customer needs. Each project reflects my commitment to craftsmanship, continuous improvement, and delivering measurable results through clean design, efficient development, and data-informed decision making.\n\n Explore a selection of my work to see how I approach complex problems, create meaningful digital experiences, and build products that make a lasting impact.
page.experience.title=Experience
page.experience.description=My professional experience spans user experience design, front-end engineering, and digital product development, with a focus on creating intuitive, accessible, and scalable web experiences. Throughout my career, I’ve collaborated with cross-functional teams to transform complex business requirements into user-centered solutions that balance functionality, performance, and visual design.\n\n I’ve contributed to enterprise-level initiatives involving UX research, design systems, personalization, accessibility, and modern front-end development. By combining creative thinking with technical expertise, I help bridge the gap between design and engineering, ensuring that ideas are translated into high-quality digital experiences. Every role has strengthened my ability to solve complex problems, communicate across disciplines, and deliver solutions that create meaningful value for both users and organizations. I continue to expand my skills while embracing new technologies, design methodologies, and best practices that drive innovation and continuous improvement.
page.contact.title=Let's Connect
page.case-study.title=Case Study
page.case-study.description=Explore the details of this project, including the design process, technical implementation, and the impact it had on users and stakeholders. Each case study provides insight into my approach to problem-solving, collaboration, and delivering user-centered solutions that meet business objectives.
page.contact.description=Thank you for visiting my portfolio. Whether you’re looking to discuss a new opportunity, collaborate on an innovative project, or simply connect with a fellow design professional, I’d love to hear from you.\n\n I’m always interested in meaningful conversations about UX design, front-end engineering, design systems, accessibility, and creating exceptional digital experiences. If you have a question, an idea, or a project in mind, don’t hesitate to reach out.\n\n Let’s connect and explore how we can create thoughtful, user-centered solutions together.
