# Experience page — Texas Instruments
experience.ti.summary=Design engineer bridging Figma prototypes and production front-end for TI's product and customer-facing pages, working across marketing, engineering, and third-party platforms to ship scalable, real-world tools.
experience.ti.bullet1=Designed and built a customizable homepage carousel widget, giving the marketing team the ability to target slides by audience and region, including multi-language content \u2014 implemented via a third-party A/B testing platform to override the default carousel without disrupting existing infrastructure.
experience.ti.bullet1.link=View case study
experience.ti.bullet2=Redesigned the End-Equipment Reference Diagram (EERD) page into a responsive display, solving a disorganized, viewport-constrained layout so customers could more easily find related products and reference designs \u2014 the improved structure also made it easier for engineers to submit and design new diagrams.
experience.ti.bullet2.link=View case study

# Experience page — Freelance / REACT Task Force
experience.react.summary=Designed and built a WordPress site for the Santa Clara County District Attorney's REACT Task Force (cybercrime unit), replacing a site with poor navigation and no organized public information.
experience.react.bullet1=Built the site to scope \u2014 public-facing crime prevention content only (scams, ID theft, high-tech crime) \u2014 while giving non-technical staff full content autonomy through WordPress, enabling real-time scam alerts and news updates.
experience.react.bullet1.link=View case study

# Experience page — FriendFinder Network
experience.ffn.summary=Maintained the front-end across multiple production websites in a high-traffic consumer platform, working hands-on with design and code for over a decade.
experience.ffn.bullet1=Built and maintained front-end interfaces using Adobe Creative Suite, HTML/CSS/JS, Bootstrap, and BackboneJS across multiple owned properties.

